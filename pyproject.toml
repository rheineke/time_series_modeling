[project]
name = "time-series-modeling"
version = "0.1.0"
description = "Data science and time series modeling on a large data set"
readme = "README.md"
requires-python = ">=3.14.8"
dependencies = [
    "ipython>=9.0",
    "joblib>=1.5",
    "matplotlib>=3.11",
    "numpy>=2.5",
    "pandas>=3.0",
    "pydotplus>=2.0",
    "scikit-learn>=1.8",
]

[project.optional-dependencies]
dev = ["ipdb", "mypy", "ruff"]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["data.py", "ipsh.py", "run_eda.py", "run_graphs.py", "run_model_fit.py", "utils.py"]

[tool.ruff]
line-length = 88
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Legacy exploratory code: unused locals and loop variables, %-formatting,
# lambdas and zip() without strict are left as written
ignore = ["B905", "F841"]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
python_files = ["*_test.py"]
